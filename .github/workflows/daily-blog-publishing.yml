name: Daily Blog Publishing

on:
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-blog-publishing
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CONTENT_COUNT: 12
      PAPERCLIP_RUN_SCRATCH_DIR: ${{ runner.temp }}/content-run
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: mkdir -p "$PAPERCLIP_RUN_SCRATCH_DIR" content/blog
      - run: node scripts/content-routine.mjs blog
      - run: npm run build
      - run: git diff --check
      - run: git config user.name "WebsiteDesignOutsource content routine"
      - run: git config user.email "content-routine@websitedesignoutsource.com"
      - run: git add content/blog automation scripts .github/workflows/daily-blog-publishing.yml
      - run: git diff --cached --quiet || git commit -m "content publish daily blog batch"
      - run: git push origin main
